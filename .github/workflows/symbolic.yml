name: symbolic snapshot

# Rebuilds the symbolic snapshot and the committed day runs of the three games
# it serves, and fails if any of them has changed.
#
# The same mechanism coverage.yml applies to the coverage artifacts, applied to
# the one day run this repository can afford to regenerate. The lexical
# snapshot needs WordNet, a frequency table and an embedding model; this one
# needs three declarations on a command line, so the whole build and a month of
# days take seconds. That makes the shipping claim for all three symbolic
# games something CI checks rather than something a session once observed.
#
# Dispatched with commit=true on a branch, it commits the regenerated run to
# that branch instead of failing, so a change that legitimately moves the days
# gets its artifact without a session rebuilding it.
on:
  push:
    branches: [main]
    paths:
      - "games/digits/**"
      - "games/figures/**"
      - "games/numbers/**"
      - "puzzlegen/content/**"
      - "puzzlegen/engine/**"
      - "puzzlegen/graph/**"
      - "puzzlegen/providers/generated.py"
      - "puzzlegen/symbols/**"
      - "tools/build_snapshot.py"
      - "docs/build-symbolic-snapshot.sh"
      - "scripts/ci.sh"
      - "scripts/ci_summary.py"
  pull_request:
    paths:
      - "games/digits/**"
      - "games/figures/**"
      - "games/numbers/**"
      - "puzzlegen/content/**"
      - "puzzlegen/engine/**"
      - "puzzlegen/graph/**"
      - "puzzlegen/providers/generated.py"
      - "puzzlegen/symbols/**"
      - "tools/build_snapshot.py"
      - "docs/build-symbolic-snapshot.sh"
      - "scripts/ci.sh"
      - "scripts/ci_summary.py"
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the regenerated day runs to the dispatched branch (never main)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: scripts/ci.sh install

      - name: Rebuild the symbolic snapshot and the three games' days
        id: rebuild
        # A requested commit turns a changed artifact into work for the next
        # step rather than a red job.
        continue-on-error: ${{ inputs.commit == true && github.ref_type == 'branch' && github.ref_name != 'main' }}
        run: scripts/ci.sh symbolic

      - name: Commit the regenerated day runs
        # Main only moves through review; a branch is where a change that
        # legitimately moves the days collects its new artifact.
        if: steps.rebuild.outcome == 'failure' && inputs.commit && github.ref_type == 'branch' && github.ref_name != 'main'
        run: |
          runs="build/shape-trio-days-30.json build/odd-number-out-days-30.json build/digit-lock-days-30.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f $runs
          git diff --cached --quiet && exit 1
          git commit -m "Regenerate the symbolic day runs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "**committed** the regenerated day runs to ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
