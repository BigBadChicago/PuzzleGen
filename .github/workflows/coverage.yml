name: coverage artifacts

# Rebuilds the committed coverage artifacts and fails if they have changed.
#
# This retires the last form of the project's recurring bug: a number in a
# document or a committed artifact that no longer matches what the code
# produces. It is runnable here because coverage is structural and applies no
# embedding gate, so a build with --dev-embeddings reproduces the committed
# files byte for byte and needs no model and no network beyond pypi.
#
# Dispatched with commit=true on a branch, it commits the regenerated files to
# that branch instead of failing, so a change that moves coverage gets its
# artifacts without a session rebuilding them.
on:
  push:
    branches: [main]
    paths:
      - "content/seeds/**"
      - "games/*/content/**"
      - "games/*/puzzlegen_grouping/**"
      - "games/*/tools/**"
      - "puzzlegen/content/**"
      - "puzzlegen/graph/**"
      - "tools/build_snapshot.py"
      - "docs/rebuild-with-batch2.sh"
      - "scripts/ci.sh"
  pull_request:
    paths:
      - "content/seeds/**"
      - "games/*/content/**"
      - "games/*/puzzlegen_grouping/**"
      - "games/*/tools/**"
      - "puzzlegen/content/**"
      - "puzzlegen/graph/**"
      - "tools/build_snapshot.py"
      - "docs/rebuild-with-batch2.sh"
      - "scripts/ci.sh"
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit regenerated artifacts to the dispatched branch (never main)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: scripts/ci.sh install

      - name: Rebuild build A2, measure it, compare to the committed files
        id: rebuild
        # A requested commit turns a changed artifact into work for the next
        # step rather than a red job.
        continue-on-error: ${{ inputs.commit == true && github.ref_name != 'main' }}
        run: scripts/ci.sh coverage

      - name: Commit the regenerated artifacts
        # Main only moves through review; a branch is where a change that
        # legitimately moves coverage collects its new numbers.
        if: steps.rebuild.outcome == 'failure' && inputs.commit && github.ref_name != 'main'
        run: |
          git diff --quiet -- build/coverage-A2.json build/lemma-collisions-A2.json && exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build/coverage-A2.json build/lemma-collisions-A2.json
          git commit -m "Regenerate build A2 coverage artifacts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "**committed** regenerated artifacts to ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
