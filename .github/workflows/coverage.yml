name: coverage artifacts

# Rebuilds the committed coverage artifacts and fails if they have changed.
#
# This retires the last form of the project's recurring bug: a number in a
# document or a committed artifact that no longer matches what the code
# produces. It is runnable here because coverage is structural and applies no
# embedding gate, so a build with --dev-embeddings reproduces the committed
# files byte for byte and needs no model and no network beyond pypi.
on:
  push:
    branches: [main]
    paths:
      - "content/seeds/**"
      - "games/*/content/**"
      - "games/*/puzzlegen_grouping/**"
      - "games/*/tools/**"
      - "puzzlegen/content/**"
      - "puzzlegen/graph/**"
      - "tools/build_snapshot.py"
      - "docs/rebuild-with-batch2.sh"
  pull_request:
    paths:
      - "content/seeds/**"
      - "games/*/content/**"
      - "games/*/puzzlegen_grouping/**"
      - "games/*/tools/**"
      - "puzzlegen/content/**"
      - "puzzlegen/graph/**"
      - "tools/build_snapshot.py"
      - "docs/rebuild-with-batch2.sh"
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          for game in games/*/; do
            [ -f "$game/pyproject.toml" ] || continue
            python -m pip install -e "$game"
          done
          # Pinned. Frequency bands decide which entities can be tiles, so a
          # wordfreq release can move every coverage number; a drift this job
          # reports should be a change in this repository, not upstream.
          python -m pip install "wordfreq==3.1.1"

      - name: Rebuild build A2 and measure it
        run: bash docs/rebuild-with-batch2.sh

      - name: The committed artifacts must match what the code produces
        run: |
          git diff --exit-code -- build/coverage-A2.json build/lemma-collisions-A2.json
