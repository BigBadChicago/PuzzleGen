[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puzzlegen-digit-lock"
version = "1.0.0"
description = "Game five for PuzzleGen: a secret code of digits, and the clues that entail it."
requires-python = ">=3.11"
# The platform, and nothing else. A game depends on the capabilities the
# engine exposes, never on how they are implemented, so there is no snapshot
# dependency here and no storage dependency: a game that could install one
# could reach the graph. The symbolic form subsystem is part of the platform
# this game depends on, and this game is the clearest case for it: "7" and
# "seven" are the same entity under two channels and neither is derivable
# from the other, so where those come from is a decision the platform owns
# rather than one each game makes again.
dependencies = ["puzzlegen>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.98"]

# How the platform finds this game. The registry reads this group and
# registers what it finds, so installing this distribution adds the game and
# uninstalling it removes the game, with no edit anywhere in the platform.
[project.entry-points."puzzlegen.games"]
digit_lock = "puzzlegen_digits:build_plugin"

[tool.setuptools.packages.find]
include = ["puzzlegen_digits*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
